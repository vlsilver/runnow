name: myrun
description: 3i Run — nhật ký chạy bộ và cộng đồng, đồng bộ từ Strava.
publish_to: none
version: 1.3.0+7

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  app_links: ^7.1.1
  cloud_firestore: ^6.4.1
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  google_sign_in: ^7.2.0
  go_router: ^17.2.3
  intl: ^0.20.2
  share_plus: ^13.1.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^10.3.1
  http: ^1.1.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  path_provider: ^2.1.5
  wakelock_plus: ^1.2.8
  firebase_analytics: ^12.4.3
  firebase_storage: ^13.4.3
  image_picker: ^1.2.3
  flutter_svg: ^2.2.1
  xml: ^6.6.1
  path_parsing: ^1.1.0
  # Bản 3.x/8-11.x đều không dùng được: bản cũ (3.0.4) có build.gradle
  # Android lỗi thời (jcenter()) không build nổi với AGP hiện tại; bản
  # 8.x-11.x xung đột version win32 với share_plus (chỉ ảnh hưởng code
  # Windows desktop, app này không build Windows, nhưng Dart vẫn biên dịch
  # cả file đó nên vẫn lỗi nếu ép version qua dependency_overrides). Bản
  # 12 beta đã tự cập nhật lên win32 mới, hết xung đột — chấp nhận dùng
  # bản beta vì bản stable hiện có không build được cho project này.
  file_picker: ^12.0.0-0
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  fake_cloud_firestore: ^4.1.1
  firebase_auth_mocks: ^0.15.2

flutter_launcher_icons:
  image_path: "features/Icon 3I Export/runow-3i-1024.png"
  android: true
  adaptive_icon_background: "#0e96a8"
  adaptive_icon_foreground: "features/Icon 3I Export/runow-3i-1024.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "features/Icon 3I Export/runow-3i-1024.png"
    background_color: "#0e96a8"
    theme_color: "#16160f"

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/brand/3i-mark.png
    - assets/brand/3i-mark-transparent.png
    # Asset chính thức của Strava, tải từ developers.strava.com — brand
    # guideline cấm tự vẽ lại hoặc chỉnh sửa logo/nút của họ.
    - assets/strava/btn_strava_connect_with_orange.png
    - assets/strava/api_logo_pwrdBy_strava_horiz_orange.png
    - assets/strava/api_logo_pwrdBy_strava_horiz_white.png
    - "features/Icon 3I Export/runow-3i-1024.png"
    - assets/medals/medal-gold.svg
    - assets/medals/medal-silver.svg
    - assets/medals/medal-bronze.svg
    - assets/journey/map-xuyen-viet.svg
    - assets/journey/images/
  fonts:
    - family: Exo 2
      fonts:
        - asset: assets/fonts/exo2/Exo2-Variable.ttf
