<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="3i Run — không gian tập luyện & cộng đồng chạy bộ.">
  <meta name="theme-color" content="#121116">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="3i Run">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=3">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=3"/>

  <title>3i Run</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #121116; }
    body { overflow: hidden; }
    #boot {
      position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
      color: #eceae3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(rgba(14,150,168,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14,150,168,.07) 1px, transparent 1px),
        radial-gradient(circle at 50% 45%, rgba(14,150,168,.13), transparent 36%),
        #121116;
      background-size: 48px 48px, 48px 48px, auto, auto;
      transition: opacity .24s ease, visibility .24s ease;
    }
    #boot.done { opacity: 0; visibility: hidden; }
    .boot-mark { text-align: center; }
    .boot-icon {
      width: 64px; height: 64px; margin: 0 auto 18px; display: block;
      border-radius: 18px; overflow: hidden;
      animation: boot-pulse 1.5s ease-in-out infinite;
    }
    .boot-icon img { width: 100%; height: 100%; display: block; }
    .boot-copy { margin-top: 7px; color: #9a958b; font-size: 11px; font-weight: 750; letter-spacing: 2px; }
    @keyframes boot-pulse { 50% { transform: translateY(-3px); box-shadow: 0 0 32px rgba(14,150,168,.22); } }
    @media (prefers-reduced-motion: reduce) { .boot-icon { animation: none; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-label="Đang mở 3i Run">
    <div class="boot-mark">
      <div class="boot-icon" aria-hidden="true">
        <img src="icons/Icon-192.png" alt="" />
      </div>
      <!-- Icon đã là chữ "3i" nên không lặp lại bằng <h1> nữa; giữ đúng
           bố cục của màn đăng nhập trong app để lúc chuyển không bị giật. -->
      <div class="boot-copy">INTENT · IMPROVE · INVOLVE</div>
    </div>
  </div>
  <script>
    // Demo web build: always prefer the latest deployed bundle over stale
    // Flutter service-worker cache. Re-enable PWA caching only after web is
    // stable enough to need offline support.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function(registrations) {
          return Promise.all(registrations.map(function(registration) {
            return registration.unregister();
          }));
        });
    }
    if ('caches' in window) {
      caches.keys()
        .then(function(keys) {
          return Promise.all(keys.map(function(key) {
            return caches.delete(key);
          }));
        });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.classList.add('done');
    });
  </script>
</body>
</html>
